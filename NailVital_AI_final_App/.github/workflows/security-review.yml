name: Backend Security & Performance Assessment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Semgrep
      run: python -m pip install semgrep

    - name: Run Semgrep (SAST)
      run: semgrep ci --config=auto
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      continue-on-error: true

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        ignore-unfixed: true
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
      continue-on-error: true

    - name: Start Backend Services for DAST & Performance
      run: |
        cd Backend
        pip install -r requirements.txt
        uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 5
      
    - name: Run Backend QA & Performance Tests
      run: |
        cd qa-backend-security
        npm install
        npm run test:security
        npm run test:performance

    - name: Upload Security Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-security-reports
        path: |
          qa-backend-security/Vulnerability Test Results/
        retention-days: 30

    - name: Publish Security Summary
      if: always()
      run: |
        echo "# Security and Performance Execution Summary" >> $GITHUB_STEP_SUMMARY
        cat qa-backend-security/Vulnerability Test Results/executive-summary.md >> $GITHUB_STEP_SUMMARY || echo "Summary generated" >> $GITHUB_STEP_SUMMARY
