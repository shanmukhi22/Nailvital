name: Web Selenium E2E Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    # Note: To fully deploy to GitHub pages automatically, a Personal Access Token 
    # or GITHUB_TOKEN with appropriate permissions is required, and actions/deploy-pages can be used.
    # For this skeleton, we assume the deployment happens or we test against the specified URL.
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./Website
      continue-on-error: true # Continuing on error for this template so tests still run

    - name: Wait for Deployment
      run: sleep 10 # Wait for pages to deploy

    - name: Run Selenium Tests
      env:
        BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      run: |
        cd qa-automation-web
        npm install
        npm run test:e2e
        
    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: web-selenium-reports
        path: |
          qa-automation-web/Test Results/
          qa-automation-web/screenshots/
          qa-automation-web/logs/
        retention-days: 30

    - name: Publish Test Summary
      if: always()
      run: |
        echo "# Web Selenium E2E Execution Summary" >> $GITHUB_STEP_SUMMARY
        cat qa-automation-web/Test\ Results/Summary/summary.md >> $GITHUB_STEP_SUMMARY || echo "Summary execution completed." >> $GITHUB_STEP_SUMMARY
