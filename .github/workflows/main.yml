name: NailVital Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium
        pip install -r "NailVital_AI_final_App/Backend/requirements.txt"
        
    - name: Run Backend API & Unit Tests
      run: |
        pytest "NailVital_AI_final_App/Backend/test_api_unit.py"

    - name: Run Selenium UI Tests
      run: |
        python "NailVital_AI_final_App/Website/server.py" &
        sleep 3
        pytest "NailVital_AI_final_App/tests/ui_website/test_website_ui.py"
