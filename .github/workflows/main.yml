name: NailVital Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium
        pip install -r "NailVital_AI_final_App/Backend/requirements.txt"
        
    - name: Run Backend API & Unit Tests
      env:
        GEMINI_API_KEY: "dummy_key"
        GROQ_API_KEY: "dummy_key"
      run: |
        cd NailVital_AI_final_App/Backend
        pytest test_api_unit.py

    - name: Run Selenium UI Tests
      run: |
        cd NailVital_AI_final_App
        python Website/server.py &
        sleep 3
        pytest tests/ui_website/test_website_ui.py

    - name: Generate Excel Test Cases
      run: |
        cd NailVital_AI_final_App
        python tests/generate_test_cases.py

    - name: Upload Excel Test Cases Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NailVital-Test-Cases
        path: NailVital_AI_final_App/NailVital_Test_Cases_Sheets.xlsx
